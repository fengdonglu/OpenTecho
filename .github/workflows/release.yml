name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base path for self-hosted)
        run: npm run build

      - name: Package dist
        run: zip -r opentecho-dist.zip dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: opentecho-dist.zip
          generate_release_notes: true
